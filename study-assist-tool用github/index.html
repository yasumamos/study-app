<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強習慣化ツール</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: white;
  color: #151515;
  font-family: "Yu Gothic", system-ui, sans-serif;
  padding: 20px 12px;
}
main { max-width: 1100px; margin: auto; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
p { color: #606875; }
.panel {
  background: white;
  border: 1px solid #dce2e9;
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}
button, input { font: inherit; }
.toolbar button, .action, .auth-btn {
  background: #f3f6fa;
  border: 1px solid #cbd5e1;
  color: #111;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
}
.auth-btn.primary {
  background: #256bc8;
  color: white;
  border-color: #256bc8;
}
button:focus-visible, input:focus-visible {
  outline: 3px solid #4186dd;
}
#monthLabel { font-weight: bold; font-size: 18px; }
#monthPicker {
  padding: 8px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: white;
  color: black;
}

/* 認証パネル */
.auth-panel {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
}
.auth-form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 10px;
}
.auth-input {
  padding: 8px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: white;
}
.user-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.message-board {
  background: #f0f7ff;
  border-left: 5px solid #6ba5eb;
  padding: 15px 20px;
  border-radius: 8px;
  margin: 18px 0;
}
.message-board h3 {
  margin: 0 0 5px 0;
  font-size: 16px;
  color: #0b4a99;
}
.message-board p {
  margin: 0;
  color: #334155;
  font-size: 14px;
  line-height: 1.6;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 10px;
  margin: 18px 0;
}
.stat {
  background: #f7f9fc;
  border-radius: 10px;
  padding: 12px;
}
.stat span { font-size: 12px; color: #596577; }
.stat strong { display: block; font-size: 23px; }

.tablewrap { overflow-x: auto; }
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 750px;
  text-align: center;
}
th, td {
  padding: 8px 5px;
  border-bottom: 1px solid #e1e6ec;
}
th {
  background: #f3f6fa;
  font-size: 13px;
}
.date {
  color: #000;
  font-weight: bold;
  text-align: left;
  white-space: nowrap;
}
.today { background: #eef5ff; }
.mark {
  width: 49px;
  height: 39px;
  border-radius: 9px;
  border: 1px solid #d5dce5;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}
.blank { background: #f4f5f7; color: #a0a6af; }
.yes { background: #cbf4df; color: #087347; }
.no { background: #ffdee2; color: #b32943; }

.minutes {
  width: 70px;
  padding: 8px 5px;
  text-align: right;
  border: 1px solid #aab5c3;
  border-radius: 7px;
  color: black;
  background: white;
  transition: background-color 0.3s, color 0.3s;
}

/* ヒートマップ用クラス */
.heatmap-1 { background-color: #e6f
